plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'maven-publish'
}

// Credenciales de firma desde keystore.properties (NO versionado en Git)
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.lebeche.barrioteca'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lebeche.barrioteca'
        minSdk 28
        targetSdk 36
        versionCode 44
        versionName '3.2.6'

        // Dominio principal y URL del proxy PHP que expone la API de SLiMS.
        // Se centralizan aqui para no hardcodearlas por todo el codigo.
        buildConfigField "String", "SITE_BASE_URL", "\"https://www.corrientelebeche.es\""
        buildConfigField "String", "API_BASE_URL", "\"https://www.corrientelebeche.es/barrioteca/api-proxy.php\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    lint {
        checkReleaseBuilds = false
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Imagenes (portadas)
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Camara + escaner de codigos de barras / QR (ML Kit)
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Tests unitarios (JVM)
    testImplementation 'junit:junit:4.13.2'
    // org.json real para los tests (en Android lo provee la plataforma)
    testImplementation 'org.json:json:20240303'
}

// Evita INSTALL_BASELINE_PROFILE_FAILED al instalar el build release en emuladores:
// androidx.profileinstaller embebe un "baseline profile" que falla en x86/x86_64.
configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}

// No genera baseline/art profiles (evita que se embeban en el APK release).
tasks.configureEach {
    if (name.contains("ArtProfile") || name.contains("StartupProfile")) {
        enabled = false
    }
}

// Publica el APK firmado en GitHub Packages (Maven). Se activa con `./gradlew publish`.
// El release.yml ejecuta `assembleRelease publish` tras firmar el APK.
publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jesuscastilla/acalenca-barrioteca-app-android-v2')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: 'local'
                password = System.getenv('GITHUB_TOKEN') ?: 'local'
            }
        }
    }
    publications {
        releaseApk(MavenPublication) {
            groupId = 'com.lebeche.barrioteca'
            artifactId = 'barrioteca'
            version = android.defaultConfig.versionName
            artifact("$buildDir/outputs/apk/release/app-release.apk") {
                extension 'apk'
            }
        }
    }
}

// La publicación a Maven debe esperar a que exista el APK release: sin esta
// dependencia, Gradle valida el artefacto antes de que `assembleRelease` lo
// genere y `publish` falla con "artifact file does not exist".
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    dependsOn 'assembleRelease'
}


